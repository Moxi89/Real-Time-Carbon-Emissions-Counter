name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install
    
    - name: Create build directories
      run: |
        mkdir -p dist
        mkdir -p dist/css
        mkdir -p dist/js
    
    - name: Copy files
      run: |
        cp index.html dist/
        cp _headers dist/
        cp _routes.json dist/
        cp static/favicon.png dist/
        cp -r css/* dist/css/
        cp -r js/* dist/js/
    
    - name: Set permissions
      run: |
        chmod -R 755 dist
    
    - name: List build output
      run: |
        ls -la dist
        ls -la dist/css
        ls -la dist/js
    
    # The actual deployment will be handled by Netlify and Cloudflare's GitHub integrations
    # This just ensures the build process works
