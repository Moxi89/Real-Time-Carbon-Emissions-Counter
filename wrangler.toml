name = "carbon-emissions-counter"
compatibility_date = "2024-01-10"

[site]
bucket = "."

[build]
command = ""

[env.production]
routes = [
  { pattern = "carbonemissionscounter.com", custom_domain = true },
  { pattern = "www.carbonemissionscounter.com", custom_domain = true }
]

[[headers]]
for = "/css/*"
[headers.values]
Content-Type = "text/css"

[[headers]]
for = "/js/*"
[headers.values]
Content-Type = "text/javascript"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Content-Security-Policy = "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:;"
