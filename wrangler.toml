name = "carbon-emissions-counter"
compatibility_date = "2024-01-10"

[site]
bucket = "./static"

[build]
command = "cp -r templates/* static/"

# Custom domain configuration
[env.production]
routes = [
  { pattern = "carbonemissionscounter.com", custom_domain = true },
  { pattern = "www.carbonemissionscounter.com", custom_domain = true }
]

[[redirects]]
pattern = "/"
destination = "/index.html"

[[redirects]]
pattern = "/*"
destination = "/index.html"
status = 200

# Force HTTPS
[[headers]]
pattern = "/*"
headers = { Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload" }
